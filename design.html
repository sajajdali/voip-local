document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

le=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72\">پیام خارج از ساعت کاری<sc-raw-select value=\"{{ vi.sel.after }}\" sc-camel-on-change=\"{{ vi.setAfter }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><sc-for list=\"{{ vi.sounds }}\" as=\"o\"><option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72\">ساعات کاری<input value=\"{{ vi.sel.hours }}\" sc-camel-on-change=\"{{ vi.setHours }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72\">مهلت انتخاب کلید (ثانیه)<input type=\"number\" value=\"{{ vi.sel.timeout }}\" sc-camel-on-change=\"{{ vi.setTo }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-weight:800;font-size:15px\">گزینه‌های منو<\u002Fspan><button sc-camel-on-click=\"{{ vi.addOpt }}\" style=\"border:1px solid #e1e3dc;background:#fff;color:#3a3b3d;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;padding:7px 12px;font-size:12px\">+ افزودن کلید<\u002Fbutton><\u002Fdiv>\n          <sc-for list=\"{{ vi.opts }}\" as=\"o\">\n            <div style=\"display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1.2fr) auto;gap:10px;align-items:center\">\n              <div style=\"width:44px;height:44px;border-radius:12px;background:#2E2F31;color:#8DC63F;display:grid;place-items:center;font-weight:800;font-size:17px\">{{ o.k }}<\u002Fdiv>\n              <input value=\"{{ o.label }}\" sc-camel-on-change=\"{{ o.setLabel }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\">\n              <sc-raw-select value=\"{{ o.dest }}\" sc-camel-on-change=\"{{ o.setDest }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><sc-for list=\"{{ vi.dests }}\" as=\"d\"><option value=\"{{ d.id }}\">{{ d.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n              <button sc-camel-on-click=\"{{ o.del }}\" title=\"حذف\" style=\"border:none;background:none;color:#b42318;font-size:16px;cursor:pointer\">✕<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:#fafbf8;border:1px dashed #cfe4ad;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-size:12px;font-weight:700;color:#3d6a0c\">پیش‌نمایش مسیر تماس<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px\"><span style=\"padding:6px 12px;border-radius:10px;background:#2E2F31;color:#fff;font-weight:700\">تماس ورودی<\u002Fspan><span style=\"color:#8b8e89\">←<\u002Fspan><span style=\"padding:6px 12px;border-radius:10px;background:#eef5e3;color:#3d6a0c;font-weight:700\">{{ vi.greetName }}<\u002Fspan><span style=\"color:#8b8e89\">←<\u002Fspan><span style=\"color:#6b6e72\">انتخاب کلید:<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding-right:16px;border-right:2px solid #dcebc4\"><sc-for list=\"{{ vi.opts }}\" as=\"o\"><div style=\"font-size:13px\"><b style=\"color:#3d6a0c\">{{ o.k }}<\u002Fb> · {{ o.label }} <span style=\"color:#8b8e89\">←<\u002Fspan> <span style=\"color:#55585c\">{{ o.destLabel }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ vi.canDel }}\"><button sc-camel-on-click=\"{{ vi.del }}\" style=\"border:none;background:#fdeceb;color:#b42318;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;align-self:flex-start\">حذف این IVR<\u002Fbutton><\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== VOIP: SOUNDS ===== -->\n  <sc-if value=\"{{ is.vsound }}\">\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap\"><div><div style=\"font-size:12px;color:#3d6a0c;font-weight:700;margin-bottom:4px\">تنظیمات VoIP<\u002Fdiv><h1 style=\"margin:0;font-size:28px;font-weight:800\">مدیریت صداها<\u002Fh1><div style=\"font-size:14px;color:#6b6e72;margin-top:6px\">فایل‌های صوتی خوشامد، منوی IVR، موسیقی انتظار و پیام‌های خارج از ساعت کاری<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><span style=\"font-size:13px;color:#6b6e72\">{{ vs.count }} فایل · {{ vs.total }}<\u002Fspan><label style=\"display:flex;align-items:center;gap:8px;border:none;background:#8DC63F;color:#1f2021;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>بارگذاری فایل صوتی<input type=\"file\" accept=\"audio/*\" sc-camel-on-change=\"{{ vs.upload }}\" style=\"display:none\"><\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><sc-for list=\"{{ vs.tabs }}\" as=\"t\"><button sc-camel-on-click=\"{{ t.onClick }}\" style=\"border:1px solid {{ t.bd }};background:{{ t.bg }};color:{{ t.fg }};padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit\">{{ t.label }} <span style=\"opacity:.7;font-size:11px\">{{ t.count }}<\u002Fspan><\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e7e8e3;border-radius:20px;overflow:hidden\"><div style=\"overflow-x:auto\"><sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:820px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"padding:11px 16px;font-size:12px;color:#6b6e72;font-weight:600;text-align:right;background:#f7f8f5;white-space:nowrap;text-align:center\">پخش<\u002Fsc-raw-th><sc-raw-th style=\"padding:11px 16px;font-size:12px;color:#6b6e72;font-weight:600;text-align:right;background:#f7f8f5;white-space:nowrap\">نام فایل<\u002Fsc-raw-th><sc-raw-th style=\"padding:11px 16px;font-size:12px;color:#6b6e72;font-weight:600;text-align:right;background:#f7f8f5;white-space:nowrap\">دسته<\u002Fsc-raw-th><sc-raw-th style=\"padding:11px 16px;font-size:12px;color:#6b6e72;font-weight:600;text-align:right;background:#f7f8f5;white-space:nowrap\">مدت<\u002Fsc-raw-th><sc-raw-th style=\"padding:11px 16px;font-size:12px;color:#6b6e72;font-weight:600;text-align:right;background:#f7f8f5;white-space:nowrap\">استفاده‌شده در<\u002Fsc-raw-th><sc-raw-th style=\"padding:11px 16px;font-size:12px;color:#6b6e72;font-weight:600;text-align:right;background:#f7f8f5;white-space:nowrap\">تاریخ بارگذاری<\u002Fsc-raw-th><sc-raw-th style=\"padding:11px 16px;font-size:12px;color:#6b6e72;font-weight:600;text-align:right;background:#f7f8f5;white-space:nowrap\"><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody><sc-for list=\"{{ vs.rows }}\" as=\"row\" hint-placeholder-count=\"6\"><sc-raw-tr>\n        <sc-raw-td style=\"padding:12px 16px;border-top:1px solid #eeefeb;font-size:13px;text-align:center\"><button sc-camel-on-click=\"{{ row.onPlay }}\" style=\"width:36px;height:36px;border-radius:50%;border:none;background:{{ row.playBg }};color:#2E2F31;display:inline-grid;place-items:center;cursor:pointer\"><sc-if value=\"{{ row.isPlaying }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M7 5h3v14H7zM14 5h3v14h-3z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg><\u002Fsc-if><sc-if value=\"{{ row.notPlaying }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg><\u002Fsc-if><\u002Fbutton><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:12px 16px;border-top:1px solid #eeefeb;font-size:13px\"><div style=\"font-weight:700\">{{ row.name }}<\u002Fdiv><div style=\"font-size:12px;color:#6b6e72;direction:ltr;text-align:right\">{{ row.file }}<\u002Fdiv><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:12px 16px;border-top:1px solid #eeefeb;font-size:13px\"><sc-raw-select value=\"{{ row.cat }}\" sc-camel-on-change=\"{{ row.setCat }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%;width:auto;padding:7px 10px\"><sc-for list=\"{{ vs.cats }}\" as=\"o\"><option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:12px 16px;border-top:1px solid #eeefeb;font-size:13px;font-variant-numeric:tabular-nums\">{{ row.durText }}<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:12px 16px;border-top:1px solid #eeefeb;font-size:13px;color:{{ row.usedFg }}\">{{ row.usedText }}<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:12px 16px;border-top:1px solid #eeefeb;font-size:13px\">{{ row.date }}<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:12px 16px;border-top:1px solid #eeefeb;font-size:13px;text-align:left\"><sc-if value=\"{{ row.canDel }}\"><button sc-camel-on-click=\"{{ row.del }}\" style=\"border:none;background:#fdeceb;color:#b42318;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit\">حذف<\u002Fbutton><\u002Fsc-if><\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== VOIP: ROUTES ===== -->\n  <sc-if value=\"{{ is.vroute }}\">\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap\"><div><div style=\"font-size:12px;color:#3d6a0c;font-weight:700;margin-bottom:4px\">تنظیمات VoIP · مسیریابی تماس<\u002Fdiv><h1 style=\"margin:0;font-size:28px;font-weight:800\">مسیرهای ورودی<\u002Fh1><div style=\"font-size:14px;color:#6b6e72;margin-top:6px;max-width:720px;line-height:1.8\">مشخص کنید هر تماس ورودی بر اساس شماره مقصد (DID) و شماره تماس‌گیرنده (CallerID) به کدام IVR، صف، گروه زنگ، شرط زمانی یا داخلی برود. مسیر دقیق‌تر همیشه اولویت دارد.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ vr.add }}\" style=\"display:flex;align-items:center;gap:8px;border:none;background:#8DC63F;color:#1f2021;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>مسیر جدید<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e7e8e3;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#f5faee,#fff);border-color:#dcebc4\">\n      <div><div style=\"font-weight:800;font-size:16px\">تست مسیر تماس<\u002Fdiv><div style=\"font-size:12px;color:#6b6e72;margin-top:4px;line-height:1.7\">یک شماره ورودی و شماره تماس‌گیرنده وارد کنید تا ببینید تماس دقیقاً به کجا می‌رود (با در نظر گرفتن لیست سیاه و شرایط زمانی).<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px\">\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">شماره مقصد (DID)<input value=\"{{ vr.testDid }}\" sc-camel-on-change=\"{{ vr.setTestDid }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%;direction:ltr;text-align:right\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">شماره تماس‌گیرنده (CallerID)<input value=\"{{ vr.testCid }}\" sc-camel-on-change=\"{{ vr.setTestCid }}\" placeholder=\"خالی = ناشناس\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%;direction:ltr;text-align:right\"><\u002Flabel>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\"><sc-for list=\"{{ vr.steps }}\" as=\"st\"><span style=\"display:flex;align-items:center;gap:8px\"><span style=\"padding:8px 12px;border-radius:10px;border:1px solid {{ st.bd }};background:{{ st.bg }};color:{{ st.fg }};font-size:13px;font-weight:700\">{{ st.n }}. {{ st.t }}<\u002Fspan><sc-if value=\"{{ st.arrow }}\"><span style=\"color:#8b8e89\">←<\u002Fspan><\u002Fsc-if><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start\">\n      <div style=\"flex:1 1 300px;display:flex;flex-direction:column;gap:10px;min-width:0\">\n        <div style=\"font-size:12px;color:#6b6e72;font-weight:700\">ترتیب بررسی مسیرها<\u002Fdiv>\n        <sc-for list=\"{{ vr.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <div sc-camel-on-click=\"{{ r.select }}\" style=\"background:{{ r.bg }};border:2px solid {{ r.bd }};border-radius:16px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;opacity:{{ r.op }}\">\n            <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:1;font-weight:800;font-size:14px\">{{ r.name }}<\u002Fspan><button sc-camel-on-click=\"{{ r.tog }}\" style=\"width:42px;height:24px;border-radius:99px;border:none;background:{{ r.onT.bg }};display:flex;justify-content:{{ r.onT.j }};align-items:center;padding:3px;cursor:pointer;flex-shrink:0\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)\"><\u002Fspan><\u002Fbutton><\u002Fdiv>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;font-size:12px\"><span style=\"padding:3px 9px;border-radius:7px;background:#f4f5f1;direction:ltr\">DID: {{ r.didText }}<\u002Fspan><span style=\"padding:3px 9px;border-radius:7px;background:#f4f5f1;direction:ltr\">CID: {{ r.cidText }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;gap:8px;font-size:12px;flex-wrap:wrap\"><span style=\"color:#3d6a0c;font-weight:700\">← {{ r.destLabel }}<\u002Fspan><span style=\"color:#6b6e72\">{{ r.typeLabel }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ vr.has }}\">\n      <div style=\"background:#fff;border:1px solid #e7e8e3;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:18px;flex:999 1 480px;min-width:0\">\n        <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\"><div style=\"flex:1;font-weight:800;font-size:18px\">{{ vr.sel.name }}<\u002Fdiv><span style=\"font-size:12px;color:#6b6e72\">فعال<\u002Fspan><button sc-camel-on-click=\"{{ vr.togOn }}\" style=\"width:42px;height:24px;border-radius:99px;border:none;background:{{ vr.onT.bg }};display:flex;justify-content:{{ vr.onT.j }};align-items:center;padding:3px;cursor:pointer;flex-shrink:0\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)\"><\u002Fspan><\u002Fbutton><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px\">\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">نام مسیر<input value=\"{{ vr.sel.name }}\" sc-camel-on-change=\"{{ vr.set.name }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">شماره DID (خالی = همه شماره‌ها)<input value=\"{{ vr.sel.did }}\" sc-camel-on-change=\"{{ vr.set.did }}\" placeholder=\"02188001234\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%;direction:ltr;text-align:right\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">الگوی CallerID (خالی = همه)<input value=\"{{ vr.sel.cid }}\" sc-camel-on-change=\"{{ vr.set.cid }}\" placeholder=\"0912XXXXXXX\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%;direction:ltr;text-align:right\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">اولویت (عدد کمتر = بالاتر)<input type=\"number\" value=\"{{ vr.sel.prio }}\" sc-camel-on-change=\"{{ vr.setPrio }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0;grid-column:1/-1\">مقصد تماس<sc-raw-select value=\"{{ vr.sel.dest }}\" sc-camel-on-change=\"{{ vr.set.dest }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><sc-for list=\"{{ vr.dests }}\" as=\"d\"><option value=\"{{ d.id }}\">{{ d.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">پیشوند نام تماس‌گیرنده<input value=\"{{ vr.sel.prefix }}\" sc-camel-on-change=\"{{ vr.set.prefix }}\" placeholder=\"مثلاً VIP:\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">موسیقی انتظار<sc-raw-select value=\"{{ vr.sel.moh }}\" sc-camel-on-change=\"{{ vr.set.moh }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><sc-for list=\"{{ vr.sounds }}\" as=\"o\"><option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">ضبط مکالمه<sc-raw-select value=\"{{ vr.sel.rec }}\" sc-camel-on-change=\"{{ vr.set.rec }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><sc-for list=\"{{ vr.recOpts }}\" as=\"o\"><option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">زبان پیام‌های سیستم<sc-raw-select value=\"{{ vr.sel.lang }}\" sc-camel-on-change=\"{{ vr.set.lang }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><sc-for list=\"{{ vr.langs }}\" as=\"o\"><option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0;grid-column:1/-1\">Alert-Info (نوع زنگ ویژه روی تلفن)<input value=\"{{ vr.sel.alert }}\" sc-camel-on-change=\"{{ vr.set.alert }}\" placeholder=\"اختیاری\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%;direction:ltr;text-align:right\"><\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid #eeefeb;border-radius:12px;background:#fafbf8\"><button sc-camel-on-click=\"{{ vr.togFax }}\" style=\"width:42px;height:24px;border-radius:99px;border:none;background:{{ vr.faxT.bg }};display:flex;justify-content:{{ vr.faxT.j }};align-items:center;padding:3px;cursor:pointer;flex-shrink:0\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)\"><\u002Fspan><\u002Fbutton><div style=\"min-width:0\"><div style=\"font-size:13px;font-weight:700;color:#232425\">تشخیص خودکار فکس<\u002Fdiv><div style=\"font-size:11px;color:#6b6e72;margin-top:2px;line-height:1.7\">اگر تماس ورودی فکس باشد، به صندوق فکس منتقل می‌شود.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fafbf8;border:1px dashed #cfe4ad;border-radius:14px;padding:12px 14px;font-size:12px;color:#55585c;line-height:2\"><b style=\"color:#3d6a0c\">راهنمای الگو:<\u002Fb> X = هر رقم · N = رقم ۲ تا ۹ · Z = رقم ۱ تا ۹ · نقطه (.) = هر تعداد رقم. مثال: <span style=\"direction:ltr;display:inline-block\">0912XXXXXXX<\u002Fspan> یعنی همه شماره‌های ۰۹۱۲.<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ vr.save }}\" style=\"display:flex;align-items:center;gap:8px;border:none;background:#8DC63F;color:#1f2021;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit\">ذخیره مسیر<\u002Fbutton><button sc-camel-on-click=\"{{ vr.dup }}\" style=\"border:1px solid #e1e3dc;background:#fff;color:#3a3b3d;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit\">کپی مسیر<\u002Fbutton><button sc-camel-on-click=\"{{ vr.del }}\" style=\"border:none;background:#fdeceb;color:#b42318;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-right:auto\">حذف<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== VOIP: TIME ===== -->\n  <sc-if value=\"{{ is.vtime }}\">\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap\"><div><div style=\"font-size:12px;color:#3d6a0c;font-weight:700;margin-bottom:4px\">تنظیمات VoIP · مسیریابی تماس<\u002Fdiv><h1 style=\"margin:0;font-size:28px;font-weight:800\">شرایط و گروه‌های زمانی<\u002Fh1><div style=\"font-size:14px;color:#6b6e72;margin-top:6px;max-width:720px;line-height:1.8\">ساعت کاری، ساعت ناهار و تعطیلات را تعریف کنید تا تماس‌ها در هر زمان به مقصد درست بروند.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><span style=\"padding:8px 14px;border-radius:12px;background:#fff;border:1px solid #e7e8e3;font-size:13px;font-weight:700;color:#3d6a0c\">{{ vtm.nowText }}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e7e8e3;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap\"><div><div style=\"font-weight:800;font-size:16px\">شرایط زمانی<\u002Fdiv><div style=\"font-size:12px;color:#6b6e72;margin-top:4px;line-height:1.7\">هر شرط زمانی یک گروه زمانی را بررسی می‌کند و تماس را به یکی از دو مقصد می‌فرستد. در مسیرهای ورودی و IVR از آن به‌عنوان مقصد استفاده کنید.<\u002Fdiv><\u002Fdiv><button sc-camel-on-click=\"{{ vtm.addCond }}\" style=\"display:flex;align-items:center;gap:8px;border:none;background:#8DC63F;color:#1f2021;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>شرط زمانی جدید<\u002Fbutton><\u002Fdiv>\n      <sc-for list=\"{{ vtm.conds }}\" as=\"c\" hint-placeholder-count=\"2\">\n        <div style=\"border:1px solid #eeefeb;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;background:#fafbf8\">\n          <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\"><input value=\"{{ c.name }}\" sc-camel-on-change=\"{{ c.setName }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%;flex:1;min-width:200px;width:auto;font-weight:700\"><span style=\"padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;background:{{ c.stBg }};color:{{ c.stFg }}\">{{ c.stLabel }}<\u002Fspan><span style=\"font-size:12px;color:#55585c\">مقصد فعلی: <b>{{ c.activeDest }}<\u002Fb><\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px\">\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">گروه زمانی<sc-raw-select value=\"{{ c.group }}\" sc-camel-on-change=\"{{ c.setGroup }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><sc-for list=\"{{ vtm.groupOpts }}\" as=\"o\"><option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">مقصد داخل بازه زمانی<sc-raw-select value=\"{{ c.open }}\" sc-camel-on-change=\"{{ c.setOpen }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><sc-for list=\"{{ vtm.dests }}\" as=\"d\"><option value=\"{{ d.id }}\">{{ d.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">مقصد خارج از بازه زمانی<sc-raw-select value=\"{{ c.closed }}\" sc-camel-on-change=\"{{ c.setClosed }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><sc-for list=\"{{ vtm.dests }}\" as=\"d\"><option value=\"{{ d.id }}\">{{ d.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\">\n            <div style=\"display:flex;align-items:center;gap:8px\"><button sc-camel-on-click=\"{{ c.togHol }}\" style=\"width:42px;height:24px;border-radius:99px;border:none;background:{{ c.holT.bg }};display:flex;justify-content:{{ c.holT.j }};align-items:center;padding:3px;cursor:pointer;flex-shrink:0\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">روش زنگ لیست<sc-raw-select value=\"{{ vf.f.strat }}\" sc-camel-on-change=\"{{ vf.setStrat }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><option value=\"hunt\">به ترتیب، یکی پس از دیگری<\u002Foption><option value=\"ringall\">همزمان همه<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">مدت زنگ هر مرحله (ثانیه)<input type=\"number\" value=\"{{ vf.f.ring }}\" sc-camel-on-change=\"{{ vf.setRing }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b6e72;min-width:0\">مقصد در صورت عدم پاسخ<sc-raw-select value=\"{{ vf.f.na }}\" sc-camel-on-change=\"{{ vf.setNa }}\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%\"><sc-for list=\"{{ vf.dests }}\" as=\"d\"><option value=\"{{ d.id }}\">{{ d.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px\"><div style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid #eeefeb;border-radius:12px;background:#fafbf8\"><button sc-camel-on-click=\"{{ vf.togCf }}\" style=\"width:42px;height:24px;border-radius:99px;border:none;background:{{ vf.cfT.bg }};display:flex;justify-content:{{ vf.cfT.j }};align-items:center;padding:3px;cursor:pointer;flex-shrink:0\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)\"><\u002Fspan><\u002Fbutton><div style=\"min-width:0\"><div style=\"font-size:13px;font-weight:700;color:#232425\">تأیید تماس<\u002Fdiv><div style=\"font-size:11px;color:#6b6e72;margin-top:2px;line-height:1.7\">شماره خارجی باید با فشردن ۱ تماس را قبول کند تا تماس به صندوق صوتی موبایل نرود.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid #eeefeb;border-radius:12px;background:#fafbf8\"><button sc-camel-on-click=\"{{ vf.togAn }}\" style=\"width:42px;height:24px;border-radius:99px;border:none;background:{{ vf.anT.bg }};display:flex;justify-content:{{ vf.anT.j }};align-items:center;padding:3px;cursor:pointer;flex-shrink:0\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)\"><\u002Fspan><\u002Fbutton><div style=\"min-width:0\"><div style=\"font-size:13px;font-weight:700;color:#232425\">اعلام نام تماس‌گیرنده<\u002Fdiv><div style=\"font-size:11px;color:#6b6e72;margin-top:2px;line-height:1.7\">قبل از وصل شدن، نام یا شماره تماس‌گیرنده پخش می‌شود.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-weight:800;font-size:14px\">لیست دنبال‌کردن<\u002Fdiv>\n          <sc-for list=\"{{ vf.list }}\" as=\"x\">\n            <div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #eeefeb;border-radius:12px;background:#fafbf8\">\n              <span style=\"width:26px;height:26px;border-radius:8px;background:#eef5e3;color:#3d6a0c;display:grid;place-items:center;font-size:12px;font-weight:800\">{{ x.idx }}<\u002Fspan>\n              <span style=\"flex:1;font-size:13px;font-weight:600\">{{ x.label }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ x.up }}\" title=\"بالا\" style=\"border:1px solid #e1e3dc;background:#fff;border-radius:8px;width:28px;height:28px;cursor:pointer\">▲<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ x.down }}\" title=\"پایین\" style=\"border:1px solid #e1e3dc;background:#fff;border-radius:8px;width:28px;height:28px;cursor:pointer\">▼<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ x.del }}\" title=\"حذف\" style=\"border:none;background:none;color:#b42318;cursor:pointer;font-size:14px\">✕<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex;gap:8px\"><input value=\"{{ vf.fmIn }}\" sc-camel-on-change=\"{{ vf.setIn }}\" placeholder=\"شماره موبایل یا داخلی…\" style=\"border:1px solid #e1e3dc;border-radius:10px;padding:10px 12px;font-size:13px;outline:none;background:#fff;color:#232425;font-family:inherit;width:100%;direction:ltr;text-align:right\"><button sc-camel-on-click=\"{{ vf.addIn }}\" style=\"border:1px solid #e1e3dc;background:#fff;color:#3a3b3d;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;padding:8px 14px;white-space:nowrap\">افزودن<\u002Fbutton><\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\"><span style=\"font-size:12px;color:#6b6e72\">افزودن سریع داخلی:<\u002Fspan><sc-for list=\"{{ vf.quick }}\" as=\"q\"><button sc-camel-on-click=\"{{ q.add }}\" style=\"border:1px solid #e1e3dc;background:#fff;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit\">+ {{ q.n }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#2E2F31;color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;justify-content:space-between;font-size:13px\"><b style=\"color:#8DC63F\">مسیر تماس<\u002Fb><span style=\"color:#b8bab5\">مجموع {{ vf.total }} ثانیه<\u002Fspan><\u002Fdiv>\n          <sc-for list=\"{{ vf.tl }}\"
