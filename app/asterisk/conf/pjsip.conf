; Base PJSIP configuration. Extensions and trunks are generated by the panel into cc/pjsip.conf.
[global]
type = global
user_agent = AflakiCallCenter
endpoint_identifier_order = ip,username,anonymous

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; WebRTC (browser) extensions: nginx terminates TLS on :443/ws and proxies to Asterisk's HTTP server
[transport-wss]
type = transport
protocol = ws
bind = 0.0.0.0

#include cc/pjsip.conf
